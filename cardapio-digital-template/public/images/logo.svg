<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#1D3557" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#logoBg)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFB703" stroke-width="4" stroke-dasharray="6,4"/>
  
  <!-- Hamburger Icon -->
  <g transform="translate(25, 25)">
    <!-- Top Bun -->
    <path d="M 30 65 C 30 35, 120 35, 120 65 Z" fill="#FFB703"/>
    <ellipse cx="55" cy="48" rx="3" ry="2" fill="#FFFFFF"/>
    <ellipse cx="75" cy="42" rx="3" ry="2" fill="#FFFFFF"/>
    <ellipse cx="95" cy="50" rx="3" ry="2" fill="#FFFFFF"/>
    
    <!-- Lettuce -->
    <path d="M 26 69 Q 40 75 55 69 Q 70 75 85 69 Q 100 75 115 69 Q 124 73 124 69" fill="none" stroke="#2B9348" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Cheese -->
    <polygon points="26,74 124,74 110,88 75,92 40,88" fill="#FFD166"/>
    
    <!-- Patty -->
    <rect x="25" y="93" width="100" height="18" rx="8" fill="#6B4226"/>
    
    <!-- Bottom Bun -->
    <rect x="30" y="114" width="90" height="14" rx="7" fill="#FFB703"/>
